<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JSDemo3</title>
  <script>
    function answer()
    {
        let no1=parseInt(document.getElementById("no1").value);
        let no2=parseInt(document.getElementById("no2").value);
        let symbol= document.getElementById("symbol").value;

        switch(symbol){
          case "+":
             document.getElementById("output").innerHTML=`Sum : ${no1+no2}`;
             break;
          case "-":
               document.getElementById("output").innerHTML=`Sub : ${no1-no2}`;
               break;
          case "*":
            document.getElementById("output").innerHTML=`Multiplication : ${no1*no2}`;
            break;
          default:
            document.getElementById("output").innerHTML=`Division : ${no1/no2}`;
            break;
        }


    }
  </script>
</head>
<body>

No1 : <input type="number" min="0" id="no1"> <br/>
No2 : <input type="number" min="0" id="no2"> <br/>
Symbol : <select name="" id="symbol" onclick="answer()">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
        </select>

<h1 id="output"></h1>
</body>
</html>
