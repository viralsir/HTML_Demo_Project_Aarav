<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Author Api Calling Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

  <script>
     document.addEventListener("DOMContentLoaded", ()=> {

       document.getElementById("loadbtn").onclick=()=>{

         document.getElementById("authorTable").innerHTML="";
         let tabledata="<tr><th>ID</th><th>Name</th> <th>Email</th>";

         fetch("http://localhost:9090/authors")
           .then(res=>res.json())
           .then(authorlist=>{

             for (let author of authorlist) {
               tabledata += `<tr><td>${author.id}</td><td>${author.name}</td><td>${author.email}</td></tr>`;
           }
             document.getElementById("authorTable").innerHTML=tabledata;
           })
       }

       document.getElementById("searchbtn").onclick=()=>{
         let authorid=document.getElementById("inputauthorid").value;

         document.getElementById("authorTable").innerHTML="";
         let tabledata="<tr><th>ID</th><th>Name</th> <th>Email</th>";

         fetch("http://localhost:9090/authors/"+authorid)
           .then(res=>res.json())
           .then(author=>{

               tabledata += `<tr><td>${author.id}</td><td>${author.name}</td><td>${author.email}</td></tr>`;

             document.getElementById("authorTable").innerHTML=tabledata;
           })


       }





     })
  </script>

</head>

<body>
<input class="form-control" type="number" placeholder="enter author id" id="inputauthorid"> <input type="button" class="btn btn-primary" value="search" id="searchbtn"> </br>

<input type="button" value="LoadData"  id="loadbtn" class="btn btn-outline-primary">
<table class="table table-bordered table-success" id="authorTable">

</table>


<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
</body>
</html>
