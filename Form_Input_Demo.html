<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Input Demo</title>
</head>
<body>

<form>

  <input type="text" size="20" placeholder="Enter User Name "> <br/>
   <input type="password" size="20" placeholder="Enter Your Password"> <br/>
  <br/>
  <input type="button" value="normal">
  <input type="submit" value="submit">
  <input type="reset" value="clear">
  <br/>

  <hr/>
  <input type="radio" name="gender" value="male"> Male
  <input type="radio" name="gender" value="female"> Female
  <hr>
  <input type="checkbox" name="vehicle" value="car"> Car
  <input type="checkbox" name="vehicle" value="motorcycle">Motorcycle
  <input type="checkbox" name="vehicle" value="bike">Bike
  <input type="checkbox" name="vehicle" value="bike2">Bike2
  <hr/>
  <select name="country" id="">
    <option value="india">India</option>
    <option value="usa">USA</option>
    <option value="australia">Australia</option>
    <option value="canada">Canada</option>
    <option value="Iran">Iran</option>
  </select>

  <input list="country" name="country" >

  <datalist id="country">
    <option value="India"></option>
    <option value="USA"></option>
    <option value="Australia"></option>
    <option value="Canada"></option>
    <option value="Iran"></option>

  </datalist>

  <hr>
  <input type="date"> <input type="datetime-local"> <input type="month"> <input type="week"> <input type="time">
  <hr>
  <input type="file">
  <textarea rows="5" cols="55"></textarea>
  <input type="color">



</form>


</body>
</html>
