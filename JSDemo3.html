<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JSDemo3</title>
  <script>
    function sum()
    {
       let no1= parseInt(document.getElementById('no1').value);
       let no2= parseInt(document.getElementById('no2').value);

       document.getElementById('output').innerText="Sum:"+ (no1+no2);
       document.getElementById('output').innerText=`Sum : ${no1+no2}`;
    }
    function sub()
    {
      let no1= parseInt(document.getElementById('no1').value);
      let no2= parseInt(document.getElementById('no2').value);

      document.getElementById('output').innerText="Sub :"+ (no1+no2);
    }
    function multiplication()
    {
      let no1= parseInt(document.getElementById('no1').value);
      let no2= parseInt(document.getElementById('no2').value);

      document.getElementById('output').innerText= "Multiplication :"+ (no1+no2);
    }
  </script>
</head>
<body>

No1 : <input type="number" min="0" id="no1"> <br/>
No2 : <input type="number" min="0" id="no2"> <br/>
<input type="button" value="sum" onclick="sum()">
<input type="button" value="sub" onclick="sub()">
<input type="button" value="multiplication" onclick="multiplication()">

<h1 id="output"></h1>
</body>
</html>
