<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JSDemo 7</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <style>
    h1{
      text-align: center;
    }
  </style>
</head>
<body>
<div class="row text-center" >
      <div class="col-5">
        <h1> Student Info </h1>
        <input type="number" id="rollno" required class="form-control" placeholder="Enter Roll No"> <br/>
        <input type="text" id="name" required class="form-control" placeholder="Enter Name "> <br/>
          <span class="text-center" style="color:red" id="mathserror"></span>
        <input type="number" id="maths" onfocusout="checkMathsmarks()" required class="form-control" placeholder="Enter Maths Marks"> <br/>
        <span class="text-center" style="color:red" id="scienceerror"></span>
        <input type="number" id="science" onfocusout="checkScienceMarks()" required class="form-control" placeholder="Enter Science Marks"> <br/>
        <span class="text-center" style="color:red" id="englisherror"></span>
        <input type="number" id="english" onfocusout="checkenglishmarks()" required class="form-control" placeholder="Enter english Marks"> <br/>

        <input type="button" value="save"  class="btn btn-outline-primary" onclick="save()"> <input type="button" value="clear" class="btn btn-outline-info" onclick="clear()">

      </div>
      <div class="col-7">
            <table class="table table-primary" id="studenttable">
                <tr>
                   <th>RollNo</th>
                  <th>Name</th>
                  <th>Maths</th>
                  <th>Science</th>
                  <th>English</th>
                  <th>Status</th>
                  <th>Total</th>
                  <th>Avg</th>
                  <th>Grade</th>
                </tr>
            </table>
      </div>

</div>

<script>

  let studentlist=[];
  function save(){

      let rollno=parseInt(document.getElementById("rollno").value);
      let name=document.getElementById("name").value;
      let maths=parseInt(document.getElementById("maths").value);
      let science=parseInt(document.getElementById("science").value);
      let english=parseInt(document.getElementById("english").value);

      let student={}
      student["rollno"]=rollno;
      student["name"]=name;
      student["maths"]=maths;
      student["science"]=science;
      student["english"]=english;

      studentlist.push(student);
      clear();
      document.getElementById("studenttable").innerHTML="<tr>\n" +
        "                   <th>RollNo</th>\n" +
        "                  <th>Name</th>\n" +
        "                  <th>Maths</th>\n" +
        "                  <th>Science</th>\n" +
        "                  <th>English</th>\n" +
        "                  <th>Status</th>\n" +
        "                  <th>Total</th>\n" +
        "                  <th>avg</th>\n" +
        "                  <th>Grade</th>\n" +
        "                </tr>";

      viewStudents();

  }
   function clear()
  {
     document.getElementById("rollno").value = "";
     document.getElementById("name").value = "";
     document.getElementById("maths").value = "";
     document.getElementById("english").value = "";
     document.getElementById("science").value = "";
  }
  function viewStudents()
  {
       let table=document.getElementById("studenttable");

    for (let student of studentlist)
    {
             let tr=document.createElement("tr");
              let rollno_td=document.createElement("td");
              rollno_td.innerHTML=student.rollno;
              tr.append(rollno_td);
              let name_td=document.createElement("td");
              name_td.innerHTML=student.name;
              tr.append(name_td);
              let maths_td=document.createElement("td");
              maths_td.innerHTML=student.maths;
              tr.append(maths_td);
              let science_td=document.createElement("td");
              science_td.innerHTML=student.science;
              tr.append(science_td);
              let english_td=document.createElement("td");
              english_td.innerHTML=student.english;
              tr.append(english_td);
              let status_td=document.createElement("td");
               let total_td=document.createElement("td");
               let avg_td=document.createElement("td");
               let grade_td=document.createElement("td");
              if(student.maths>=35 && student.science>=35 && student.english>35)
              {
                  status_td.innerHTML="Pass";
                  status_td.style.color="green";
                  total_td.innerHTML=student.maths+student.science+student.english;
                  let avg= Math.round((student.maths+student.science+student.english)/3);
                  avg_td.innerHTML= avg;
                  if(avg>=90)
                  {
                    grade_td.innerHTML="A";
                  }
                  else if(avg>70)
                  {
                    grade_td.innerHTML="B";
                  }
                  else if(avg>50){
                    grade_td.innerHTML="C";
                  }
                  else {
                    grade_td.innerHTML="D";
                  }

              }
              else{
                status_td.innerHTML="Fail";
                status_td.style.color="red";
                total_td.innerHTML="-";
                avg_td.innerHTML="-";
                grade_td.innerHTML="-";
              }
              tr.append(status_td);
              tr.append(total_td);
              tr.append(avg_td);
              tr.append(grade_td);


              table.append(tr);

    }



  }

  function checkMathsmarks(){
        let maths=parseInt(document.getElementById("maths").value);
        if(maths<0 || maths>100)
        {
           document.getElementById("mathserror").innerHTML="Invalid Maths Marks it should be between 0 and 100";

        }
        else {
          document.getElementById("mathserror").innerHTML="";
        }

  }

  function checkScienceMarks(){
    let science=parseInt(document.getElementById("science").value);
    if(science<0 || science>100)
    {
      document.getElementById("scienceerror").innerHTML="Invalid Maths Marks it should be between 0 and 100";

    }
    else {
      document.getElementById("scienceerror").innerHTML="";
    }

  }
  function checkenglishmarks(){
    let english=parseInt(document.getElementById("english").value);
    if(english<0 || english>100)
    {
      document.getElementById("englisherror").innerHTML="Invalid Maths Marks it should be between 0 and 100";

    }
    else {
      document.getElementById("englisherror").innerHTML="";
    }

  }

</script>



 <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
 <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
</body>
</html>
